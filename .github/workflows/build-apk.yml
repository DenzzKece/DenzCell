name: Build DenzzCell APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q DenzzCell_GitHub_APK_Source_58mm.zip -d source
          ls source/DenzzCell_GitHub

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p source/DenzzCell_GitHub assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DenzzCell-debug-apk
          path: source/DenzzCell_GitHub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
